<svg xmlns="http://www.w3.org/2000/svg" width="840" height="416" aria-labelledby="title desc" role="img" viewBox="0 0 840 416"><title id="title">Questions go one step up</title><desc id="desc">An agent asks its coordinator. The coordinator answers or passes a decision to the person. The person answers through the coordinator, who returns the answer to the original asker. An agent cannot ask the person directly.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif;fill:#1f2328}.card{fill:#fff;stroke:#d1d9e0}.head{font-size:14px;font-weight:600}.aside{font-size:12px;fill:#59636e}.t1{font-size:14px;font-weight:600}.label,.t2{font-size:12px;fill:#59636e}.edge{fill:none;stroke:#8c959f;stroke-width:1.5}.edge.back{stroke:#bc4c00;stroke-dasharray:5 4}.edge.leader{stroke-width:1;stroke-dasharray:2 3}.tip{fill:#8c959f}.label.back,.tip.back{fill:#bc4c00}.person rect{fill:#ddf4ff;stroke:#54aeff}.person .t1{fill:#0a3069}.person .t2{fill:#0550ae}.agent rect{fill:#fbefff;stroke:#c297ff}.agent .t1{fill:#3e1f79}.agent .t2{fill:#6639ba}.check rect{fill:#fff8c5;stroke:#d4a72c}.check .t1{fill:#4d2d00}.check .t2{fill:#7d4e00}@media (prefers-color-scheme:dark){text{fill:#f0f6fc}.card{fill:#0d1117;stroke:#3d444d}.aside,.label,.t2{fill:#9198a1}.edge{stroke:#6e7681}.edge.back{stroke:#f0883e}.tip{fill:#6e7681}.label.back,.tip.back{fill:#f0883e}.person rect{fill:#0c2d6b;stroke:#1f6feb}.person .t1{fill:#cae8ff}.person .t2{fill:#a5d6ff}.agent rect{fill:#271052;stroke:#8957e5}.agent .t1{fill:#ecdeff}.agent .t2{fill:#d2a8ff}.check rect{fill:#272115;stroke:#9e6a03}.check .t1{fill:#f8e3a1}.check .t2{fill:#e3b341}}</style><defs><marker id="tip" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 1 L9 5 L0 9 z" class="tip"/></marker><marker id="tip-back" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 1 L9 5 L0 9 z" class="tip back"/></marker></defs><rect width="839" height="415" x=".5" y=".5" class="card" rx="12"/><text x="24" y="34" class="head">Questions go one step up</text><g class="agent"><rect width="180" height="54" x="50" y="58" rx="8"/><text x="140" y="81" class="t1" text-anchor="middle">Agent</text><text x="140" y="99" class="t2" text-anchor="middle">asks its coordinator</text></g><g class="check"><rect width="180" height="54" x="330" y="58" rx="8"/><text x="420" y="81" class="t1" text-anchor="middle">Coordinator</text><text x="420" y="99" class="t2" text-anchor="middle">answers or passes it up</text></g><g class="person"><rect width="180" height="54" x="610" y="58" rx="8"/><text x="700" y="81" class="t1" text-anchor="middle">Person</text><text x="700" y="99" class="t2" text-anchor="middle">answers when asked</text></g><path d="M 140 116 L 140 383" class="edge leader"/><path d="M 420 116 L 420 383" class="edge leader"/><path d="M 700 116 L 700 383" class="edge leader"/><path marker-end="url(#tip)" d="M 140 154 L 420 154" class="edge"/><text x="280" y="146" class="label" text-anchor="middle">question</text><path marker-end="url(#tip)" d="M 420 204 L 140 204" class="edge"/><text x="280" y="196" class="label" text-anchor="middle">answer</text><path marker-end="url(#tip)" d="M 420 254 L 700 254" class="edge"/><text x="560" y="246" class="label" text-anchor="middle">pass decision up</text><path marker-end="url(#tip)" d="M 700 304 L 420 304" class="edge"/><text x="560" y="296" class="label" text-anchor="middle">person answers</text><path marker-end="url(#tip)" d="M 420 354 L 140 354" class="edge"/><text x="280" y="346" class="label" text-anchor="middle">return answer to asker</text><text x="420" y="400" class="aside" text-anchor="middle">Agents cannot send a decision straight to the person.</text></svg>