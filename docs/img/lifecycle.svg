<svg xmlns="http://www.w3.org/2000/svg" width="840" height="392" aria-labelledby="title desc" role="img" viewBox="0 0 840 392"><title id="title">An item&apos;s life</title><desc id="desc">Drawn from src/machine.js. An item starts open and ends verified or withdrawn. open to claimed: claim. claimed to open: release, lapse (clock), escalate, refreeze. claimed to submitted: submit. submitted to verified: accept. submitted to open: reject, reopen, refreeze. open to withdrawn: withdraw. claimed to withdrawn: withdraw. submitted to withdrawn: withdraw.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,&apos;SF Mono&apos;,Menlo,Consolas,&apos;Liberation Mono&apos;,monospace}.card,.plain rect{fill:#fff;stroke:#d1d9e0}.plain rect{fill:#f6f8fa}.head{font-size:14px;font-weight:600}.aside{font-size:12px;fill:#59636e}.t1{font-size:14px;font-weight:600}.code,.label,.t2{fill:#59636e}.label,.t2{font-size:12px}.code{font-size:11.5px}.edge{fill:none;stroke:#8c959f;stroke-width:1.5}.edge.back{stroke:#bc4c00;stroke-dasharray:5 4}.edge.leader{stroke-width:1;stroke-dasharray:2 3}.tip{fill:#8c959f}.label.back,.tip.back{fill:#bc4c00}.done rect{fill:#dafbe1;stroke:#4ac26b}.done .t1{fill:#044f1e}.done .t2{fill:#116329}@media (prefers-color-scheme:dark){text{fill:#f0f6fc}.card,.plain rect{fill:#0d1117;stroke:#3d444d}.plain rect{fill:#151b23}.aside,.code,.label,.t2{fill:#9198a1}.edge{stroke:#6e7681}.edge.back{stroke:#f0883e}.tip{fill:#6e7681}.label.back,.tip.back{fill:#f0883e}.done rect{fill:#04260f;stroke:#238636}.done .t1{fill:#aff5b4}.done .t2{fill:#7ee787}}</style><defs><marker id="tip" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 1 L9 5 L0 9 z" class="tip"/></marker><marker id="tip-back" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 1 L9 5 L0 9 z" class="tip back"/></marker></defs><rect width="839" height="391" x=".5" y=".5" class="card" rx="12"/><text x="24" y="34" class="head">An item&apos;s life</text><text x="140" y="34" class="aside">starts open; ends verified or withdrawn</text><g class="plain"><rect width="160" height="58" x="25" y="150" rx="8"/><text x="105" y="175" class="t1" text-anchor="middle">open</text><text x="105" y="193" class="t2" text-anchor="middle">↻ escalate · refreeze</text></g><g class="plain"><rect width="160" height="58" x="235" y="150" rx="8"/><text x="315" y="175" class="t1" text-anchor="middle">claimed</text><text x="315" y="193" class="t2" text-anchor="middle">↻ claim · refreeze</text></g><g class="plain"><rect width="160" height="58" x="445" y="150" rx="8"/><text x="525" y="175" class="t1" text-anchor="middle">submitted</text><text x="525" y="193" class="t2" text-anchor="middle">↻ reserve</text></g><g class="done" data-final="verified"><rect width="160" height="58" x="655" y="150" rx="8"/><rect width="152" height="50" x="659" y="154" fill="none" rx="5"/><text x="735" y="184" class="t1" text-anchor="middle">verified</text></g><g class="plain" data-final="withdrawn"><rect width="160" height="58" x="445" y="284" rx="8"/><rect width="152" height="50" x="449" y="288" fill="none" rx="5"/><text x="525" y="318" class="t1" text-anchor="middle">withdrawn</text></g><path marker-end="url(#tip)" d="M 185 179 L 231 179" class="edge"/><text x="208" y="171" class="label" text-anchor="middle">claim</text><path marker-end="url(#tip-back)" d="M 335 150 L 335 120 L 145 120 L 145 146" class="edge back"/><text x="240" y="94" class="label back" text-anchor="middle">release · lapse (clock)</text><text x="240" y="109" class="label back" text-anchor="middle">escalate · refreeze</text><path marker-end="url(#tip)" d="M 395 179 L 441 179" class="edge"/><text x="418" y="171" class="label" text-anchor="middle">submit</text><path marker-end="url(#tip)" d="M 605 179 L 651 179" class="edge"/><text x="628" y="171" class="label" text-anchor="middle">accept</text><path marker-end="url(#tip-back)" d="M 545 150 L 545 66 L 115 66 L 115 146" class="edge back"/><text x="330" y="58" class="label back" text-anchor="middle">reject · reopen · refreeze</text><path marker-end="url(#tip)" d="M 105 208 L 105 313 L 441 313" class="edge"/><text x="210" y="305" class="label" text-anchor="middle">withdraw</text><path d="M 315 208 L 315 313" class="edge"/><path marker-end="url(#tip)" d="M 525 208 L 525 280" class="edge"/><g class="plain"><rect width="176" height="94" x="640" y="26" rx="8"/></g><text x="652" y="46" class="label">every way into verified</text><text x="652" y="64" class="code mono">NOT_AT_COMMIT</text><text x="652" y="80" class="code mono">SELF_VERIFY</text><text x="652" y="96" class="code mono">CRITERIA_CHANGED</text><text x="652" y="112" class="code mono">PROOF_REQUIRED</text><path d="M 735 122 L 735 146" class="edge leader"/><g class="plain"><rect width="176" height="62" x="640" y="284" rx="8"/></g><text x="652" y="304" class="label">every way into withdrawn</text><text x="652" y="322" class="code mono">COORDINATOR_ONLY</text><text x="652" y="338" class="code mono">NOTE_REQUIRED</text><path d="M 640 313 L 609 313" class="edge leader"/><text x="24" y="374" class="aside">↻ a move that keeps the state · dashed: back to open · double border: final · codes: the refusal each guard raises</text></svg>