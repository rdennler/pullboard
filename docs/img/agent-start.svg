<svg xmlns="http://www.w3.org/2000/svg" width="840" height="476" aria-labelledby="title desc" role="img" viewBox="0 0 840 476"><title id="title">Starting with an agent</title><desc id="desc">You run pullboard init in your git repo, commit what it wrote, open a new Claude Code session in that folder and say what to build. That agent becomes the coordinator: it takes the spec with you, and only you approve a row; it proposes lanes and plans items with frozen bars; it starts a builder subagent per lane in its own worktree and a verifier that built none of it; it merges verified work only, and reports.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif;fill:#1f2328}.card{fill:#fff;stroke:#d1d9e0}.head,.t1{font-size:14px;font-weight:600}.t2{font-size:12px;fill:#59636e}.edge{fill:none;stroke:#8c959f;stroke-width:1.5}.edge.back{stroke:#bc4c00;stroke-dasharray:5 4}.tip{fill:#8c959f}.tip.back{fill:#bc4c00}.frame{fill:none;stroke:#d1d9e0;stroke-dasharray:4 4}.person rect{fill:#ddf4ff;stroke:#54aeff}.person .t1{fill:#0a3069}.person .t2{fill:#0550ae}.agent rect{fill:#fbefff;stroke:#c297ff}.agent .t1{fill:#3e1f79}.agent .t2{fill:#6639ba}.done rect{fill:#dafbe1;stroke:#4ac26b}.done .t1{fill:#044f1e}.done .t2{fill:#116329}@media (prefers-color-scheme:dark){text{fill:#f0f6fc}.card{fill:#0d1117;stroke:#3d444d}.t2{fill:#9198a1}.edge{stroke:#6e7681}.edge.back{stroke:#f0883e}.tip{fill:#6e7681}.tip.back{fill:#f0883e}.frame{stroke:#3d444d}.person rect{fill:#0c2d6b;stroke:#1f6feb}.person .t1{fill:#cae8ff}.person .t2{fill:#a5d6ff}.agent rect{fill:#271052;stroke:#8957e5}.agent .t1{fill:#ecdeff}.agent .t2{fill:#d2a8ff}.done rect{fill:#04260f;stroke:#238636}.done .t1{fill:#aff5b4}.done .t2{fill:#7ee787}}</style><defs><marker id="tip" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 1 L9 5 L0 9 z" class="tip"/></marker><marker id="tip-back" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 1 L9 5 L0 9 z" class="tip back"/></marker></defs><rect width="839" height="475" x=".5" y=".5" class="card" rx="12"/><text x="24" y="34" class="head">Starting with an agent</text><rect width="388" height="400" x="24" y="52" class="frame" rx="10"/><rect width="388" height="400" x="428" y="52" class="frame" rx="10"/><text x="44" y="78" class="t1">You, once</text><text x="448" y="78" class="t1">The agent, as coordinator</text><g class="person"><rect width="348" height="56" x="44" y="92" rx="8"/><text x="218" y="116" class="t1" text-anchor="middle">pullboard init</text><text x="218" y="134" class="t2" text-anchor="middle">in your project&apos;s git repo</text></g><g class="person"><rect width="348" height="56" x="44" y="188" rx="8"/><text x="218" y="212" class="t1" text-anchor="middle">Commit what init wrote</text><text x="218" y="230" class="t2" text-anchor="middle">git add -A, then git commit</text></g><g class="person"><rect width="348" height="56" x="44" y="284" rx="8"/><text x="218" y="308" class="t1" text-anchor="middle">Open a new session</text><text x="218" y="326" class="t2" text-anchor="middle">Claude Code, in that folder</text></g><g class="person"><rect width="348" height="56" x="44" y="380" rx="8"/><text x="218" y="404" class="t1" text-anchor="middle">Say what to build</text><text x="218" y="422" class="t2" text-anchor="middle">&quot;use pullboard to build …&quot;</text></g><path marker-end="url(#tip)" d="M 218 148 L 218 184" class="edge"/><path marker-end="url(#tip)" d="M 218 244 L 218 280" class="edge"/><path marker-end="url(#tip)" d="M 218 340 L 218 376" class="edge"/><g class="agent"><rect width="348" height="56" x="448" y="92" rx="8"/><text x="622" y="116" class="t1" text-anchor="middle">Spec with you</text><text x="622" y="134" class="t2" text-anchor="middle">only you approve a row</text></g><g class="agent"><rect width="348" height="56" x="448" y="164" rx="8"/><text x="622" y="188" class="t1" text-anchor="middle">Lanes and a plan</text><text x="622" y="206" class="t2" text-anchor="middle">items with frozen bars</text></g><g class="agent"><rect width="348" height="56" x="448" y="236" rx="8"/><text x="622" y="260" class="t1" text-anchor="middle">A builder per lane</text><text x="622" y="278" class="t2" text-anchor="middle">subagents in worktrees</text></g><g class="agent"><rect width="348" height="56" x="448" y="308" rx="8"/><text x="622" y="332" class="t1" text-anchor="middle">A verifier</text><text x="622" y="350" class="t2" text-anchor="middle">built none of it, checks each</text></g><g class="done"><rect width="348" height="56" x="448" y="380" rx="8"/><text x="622" y="404" class="t1" text-anchor="middle">Merge and report</text><text x="622" y="422" class="t2" text-anchor="middle">verified work only</text></g><path marker-end="url(#tip)" d="M 622 148 L 622 160" class="edge"/><path marker-end="url(#tip)" d="M 622 220 L 622 232" class="edge"/><path marker-end="url(#tip)" d="M 622 292 L 622 304" class="edge"/><path marker-end="url(#tip)" d="M 622 364 L 622 376" class="edge"/><path marker-end="url(#tip)" d="M 392 408 L 420 408 L 420 120 L 444 120" class="edge"/></svg>