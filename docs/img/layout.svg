<svg xmlns="http://www.w3.org/2000/svg" width="840" height="404" aria-labelledby="title desc" role="img" viewBox="0 0 840 404"><title id="title">Where things live</title><desc id="desc">The main checkout is the coordinator. It holds SPEC.md, DOCTRINE.md, pullboard.json, AGENTS.md and the git hooks. Inside .git, shared by every worktree, are the board, board.sqlite, and the pinned submitted commits. Beside it, each agent works in its own worktree: builders in their lanes and a verifier that built none of it, all on the same board. pullboard view lists every project on this machine.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,&apos;SF Mono&apos;,Menlo,Consolas,&apos;Liberation Mono&apos;,monospace}.card,.plain rect{fill:#fff;stroke:#d1d9e0}.plain rect{fill:#f6f8fa}.head{font-size:14px;font-weight:600}.aside{font-size:12px;fill:#59636e}.t1{font-size:14px;font-weight:600}.label,.t2{font-size:12px;fill:#59636e}.edge{fill:none;stroke:#8c959f;stroke-width:1.5}.edge.back{stroke:#bc4c00;stroke-dasharray:5 4}.tip{fill:#8c959f}.label.back,.tip.back{fill:#bc4c00}.frame{fill:none;stroke:#d1d9e0;stroke-dasharray:4 4}.person rect{fill:#ddf4ff;stroke:#54aeff}.person .t1{fill:#0a3069}.person .t2{fill:#0550ae}.agent rect{fill:#fbefff;stroke:#c297ff}.agent .t1{fill:#3e1f79}.agent .t2{fill:#6639ba}@media (prefers-color-scheme:dark){text{fill:#f0f6fc}.card{fill:#0d1117;stroke:#3d444d}.aside,.label,.t2{fill:#9198a1}.edge{stroke:#6e7681}.edge.back{stroke:#f0883e}.tip{fill:#6e7681}.label.back,.tip.back{fill:#f0883e}.frame,.plain rect{stroke:#3d444d}.plain rect{fill:#151b23}.person rect{fill:#0c2d6b;stroke:#1f6feb}.person .t1{fill:#cae8ff}.person .t2{fill:#a5d6ff}.agent rect{fill:#271052;stroke:#8957e5}.agent .t1{fill:#ecdeff}.agent .t2{fill:#d2a8ff}}</style><defs><marker id="tip" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 1 L9 5 L0 9 z" class="tip"/></marker><marker id="tip-back" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 1 L9 5 L0 9 z" class="tip back"/></marker></defs><rect width="839" height="403" x=".5" y=".5" class="card" rx="12"/><text x="24" y="34" class="head">Where things live</text><rect width="400" height="328" x="24" y="52" class="frame" rx="10"/><text x="44" y="80" class="t1">your repo: the main checkout</text><text x="44" y="98" class="aside">the coordinator files, merges and talks with you</text><text x="44" y="130" class="mono label">SPEC.md</text><text x="204" y="130" class="label">what to build, one row per id</text><text x="44" y="152" class="mono label">DOCTRINE.md</text><text x="204" y="152" class="label">the house rules</text><text x="44" y="174" class="mono label">pullboard.json</text><text x="204" y="174" class="label">gate, lanes, commit rules</text><text x="44" y="196" class="mono label">AGENTS.md, .claude/</text><text x="204" y="196" class="label">how agents work here</text><text x="44" y="218" class="mono label">.githooks/</text><text x="204" y="218" class="label">commit and push checks</text><g class="plain"><rect width="360" height="126" x="44" y="236" rx="8"/></g><text x="60" y="260" class="t1 mono">.git, shared by every worktree</text><text x="60" y="288" class="mono label">pullboard/board.sqlite</text><text x="60" y="305" class="aside">items, claims, verdicts, shouts</text><text x="60" y="333" class="mono label">refs/pullboard/items</text><text x="60" y="350" class="aside">every submitted commit, pinned</text><g class="agent"><rect width="336" height="56" x="480" y="60" rx="8"/><text x="648" y="84" class="t1 mono" text-anchor="middle">../repo-web-1</text><text x="648" y="102" class="t2" text-anchor="middle">builder · web lane</text></g><g class="agent"><rect width="336" height="56" x="480" y="140" rx="8"/><text x="648" y="164" class="t1 mono" text-anchor="middle">../repo-api-1</text><text x="648" y="182" class="t2" text-anchor="middle">builder · api lane</text></g><g class="agent"><rect width="336" height="56" x="480" y="220" rx="8"/><text x="648" y="244" class="t1 mono" text-anchor="middle">../repo-review-1</text><text x="648" y="262" class="t2" text-anchor="middle">verifier · built none of it</text></g><path d="M 480 88 L 452 88" class="edge"/><path d="M 480 168 L 452 168" class="edge"/><path d="M 480 248 L 452 248" class="edge"/><path marker-end="url(#tip)" d="M 452 88 L 452 300 L 408 300" class="edge"/><text x="470" y="300" class="aside">one board: every worktree reads and writes it</text><g class="person"><rect width="336" height="56" x="480" y="320" rx="8"/><text x="648" y="344" class="t1 mono" text-anchor="middle">~/.pullboard/projects.json</text><text x="648" y="362" class="t2" text-anchor="middle">pullboard view: every project here</text></g></svg>